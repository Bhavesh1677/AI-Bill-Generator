server.port=8000
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_bill_generator
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Multipart / File Uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:ai_bill_generator_super_secure_jwt_access_token_secret_key_2026_solid}
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=864000000

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://indopos.vercel.app}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:bhavesh123}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:877957688361127}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:VaDzzIpOA0a_itgD7aGkLg-tLbI}

# Local Storage Directory for Logos
app.upload.dir=public/uploads/logos
